<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SmartProject Favicon">
  <defs>
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#074E84"/>
      <stop offset="100%" stop-color="#052342"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD26A"/>
      <stop offset="55%" stop-color="#FCBC45"/>
      <stop offset="100%" stop-color="#E8730C"/>
