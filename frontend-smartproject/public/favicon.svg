  <rect x="24" y="42" width="18" height="5.5" rx="2.75" fill="#FFFFFF"/>
  <!-- Milestone diamond -->
  <polygon points="49,40 53,44.5 49,49 45,44.5" fill="#FCBC45"/>
  <!-- Base bar -->
  <rect x="12" y="50" width="40" height="3.5" rx="1.75" fill="#2380C6"/>
  <rect x="12" y="50" width="21" height="3.5" rx="1.75" fill="#FCBC45"/>
</svg>
