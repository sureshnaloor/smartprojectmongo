  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favNavy)" stroke="#2380C6" stroke-width="2"/>
  <!-- Crane mast & jib -->
  <path d="M16 49 L16 16 M12 18 L50 18 M16 11 L16 18 L42 18" fill="none" stroke="url(#favGold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
